name: Sync Blogger Posts

on:
  schedule:
    # 每週一、週四台灣時間凌晨 03:00 自動執行 (UTC 週日、週三 19:00)
    - cron: "0 19 * * 0,3"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync posts from goodadhd.blogspot.com
        run: python3 scripts/sync_blog.py

      - name: Commit updated posts.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/posts.json
          if git diff --staged --quiet; then
            echo "No new blog posts to commit."
          else
            git commit -m "chore: sync blog posts from 314風神學院"
            git push
          fi
