<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>診間即時看板｜兒青門診</title>
  <link rel="stylesheet" href="./assets/style.css?v=6" />
</head>
<body>
  <div class="container wide">
    <header class="header">
      <h1>診間即時看板</h1>
      <p>自動同步候診個案填寫的看診前調查表，方便醫師看診前快速掌握重點。</p>
    </header>

    <section id="pin-gate" class="card" style="max-width:400px;margin:30px auto;">
      <h2 class="card-title">🔒 請輸入診間看板密碼</h2>
      <div class="field-group">
        <input type="password" id="pin-input" placeholder="請輸入密碼" />
      </div>
      <div id="pin-error" class="alert alert-danger hidden" style="margin-bottom:12px;">
        密碼不正確，請再試一次。
      </div>
      <button type="button" id="pin-btn" class="btn btn-primary">進入看板</button>
    </section>

    <main id="dashboard" class="hidden">
      <div id="mode-notice" class="alert alert-warning hidden" style="margin-bottom:14px;"></div>

      <section class="card" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
        <div>
          <strong style="font-size:1.02rem;">門診填寫開關：</strong>
          <span id="clinic-status-badge" class="badge badge-stable">🟢 開放填寫中</span>
          <div style="margin-top:6px;font-size:0.88rem;color:#475569;">
            個案填寫網址：<a id="patient-url-link" href="./" target="_blank" rel="noopener" style="color:#1f6f78;font-weight:600;"></a>
            <button type="button" id="copy-url-btn" class="btn btn-secondary btn-sm" style="margin-left:6px;padding:3px 9px;font-size:0.8rem;">複製網址</button>
          </div>
        </div>
        <button type="button" id="toggle-clinic-btn" class="btn btn-secondary btn-sm">切換為關閉填寫</button>
      </section>

      <div class="toolbar">
        <div class="inline-row">
          <select id="filter-status" style="width:auto;">
            <option value="待看診">僅顯示：待看診</option>
            <option value="all">顯示全部</option>
            <option value="已看診">僅顯示：已看診</option>
          </select>
          <button type="button" id="refresh-btn" class="btn btn-secondary btn-sm">↻ 立即更新</button>
        </div>
        <span id="last-updated" class="hint"></span>
      </div>

      <div id="records-list"></div>
    </main>
  </div>

  <script src="./assets/config.js?v=6"></script>
  <script src="./assets/doctor.js?v=6"></script>
</body>
</html>
